[book]
title = "Placement Preparation Knowledge Base"
authors = ["Placement Prep Contributors"]
description = "A comprehensive, self-improving placement preparation resource for Software Engineering interviews"
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = true

[output.html]
default-theme = "light"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/vanos001/placement_prep"
edit-url-template = "https://github.com/vanos001/placement_prep/edit/main/{path}"
additional-css = ["custom.css"]
additional-js = ["mermaid-init.js"]
