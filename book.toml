[book]
title = "Placement Preparation Knowledge Base"
authors = ["Placement Prep Contributors"]
description = "A comprehensive, self-improving placement preparation resource for Software Engineering interviews"
language = "en"
src = "src"

[build]
build-dir = "book"
# false: a dangling SUMMARY reference must FAIL the build, not silently
# scaffold an empty page (review §V.5). scripts/check-summary.py enforces
# the same invariant, this makes the renderer itself fail loudly too.
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/vanos001/placement_prep"
# `research` is a strict superset of `main` (verified: 0 commits and 0 files
# missing), and it is where content is authored, so edit links resolve for
# every page. Pointing at `main` 404s on research-only pages.
edit-url-template = "https://github.com/vanos001/placement_prep/edit/research/{path}"
additional-css = ["custom.css"]
additional-js = ["mermaid-init.js"]
mathjax-support = true
