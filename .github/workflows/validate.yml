name: Validate book

# Research-branch review §V.4/§V.5: the validators ("validate-all.sh") were
# never wired into CI, so "validators green" existed only in commit messages,
# and external URLs / DOIs were never machine-checked. This workflow runs the
# full validation gate on every push/PR, and re-probes external URLs + DOIs
# weekly (they rot over time).

on:
  push:
    branches: [main, dev, research]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC: external link/DOI re-check

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install real mermaid parser deps
        run: (cd scripts && npm i --no-audit --no-fund mermaid@11 jsdom)

      - name: Run full validation (strict; internal checks)
        run: STRICT=1 ./scripts/validate-all.sh

      - name: Probe DOIs + external URLs
        run: EXTERNAL=1 ./scripts/validate-all.sh
